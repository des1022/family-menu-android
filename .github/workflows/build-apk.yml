# 推送到 main/master 或手动触发后，GitHub 云端自动编译出 debug APK，
# 无需本机安装任何 Android 环境。
# 仅改文档（.md）不触发构建，避免浪费 runner 时长；需要时可在 Actions 页手动 Run workflow。
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages and accept licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Ensure fixed debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
            echo "::notice::generated new debug.keystore (not yet committed to repo)"
          else
            echo "::notice::using repo debug.keystore"
          fi

      - name: Build debug APK
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-menu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk